workflows:
  movieshelf-ipa:
    name: MovieShelf IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Build unsigned app
        script: |
          xcodebuild -project MovieShelf.xcodeproj \
            -scheme MovieShelf \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA
        script: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/MovieShelf.app Payload/
          zip -qr MovieShelf.ipa Payload
    artifacts:
      - MovieShelf.ipa
